name: Deploy to Hetzner

on:
  push:
    branches: ["**"]

jobs:
  web-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          cache: yarn

      - name: Install packages
        run: yarn

      - name: Build project
        run: yarn build

      - name: Deploy
        if: github.ref_name == 'main'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER: ${{ secrets.SERVER }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          # Server is SFTP-only (no shell), so rsync is out; lftp mirrors over
          # the SFTP subsystem. The ":@" gives an empty password so lftp relies
          # solely on the SSH key in connect-program.
          lftp -c "
            set sftp:connect-program \"ssh -a -x -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null\";
            set net:max-retries 2;
            set net:persist-retries 0;
            open sftp://$USERNAME:@$SERVER;
            mirror --reverse --delete --parallel=16 --verbose dist/ public_html/homepage/;
          "
